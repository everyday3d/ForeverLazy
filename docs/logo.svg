<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 400 400" role="img" aria-label="Forever Lazy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#2a1740"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#f0a92b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4db8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4db8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="56" fill="url(#bg)"/>
  <rect x="6" y="6" width="388" height="388" rx="50" fill="none" stroke="#ffe9a6" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="200" cy="165" r="150" fill="url(#glow)"/>
  <!-- the three arrows -->
  <g transform="translate(200 160)">
    <g transform="rotate(-30) translate(-100 14)" opacity="0.95">
      <path d="M0 -42 L32 28 L0 10 L-32 28 Z" fill="#6bd16b" stroke="#0f1b2d" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(30) translate(104 12)" opacity="0.95">
      <path d="M0 -38 L29 25 L0 9 L-29 25 Z" fill="#ffd94d" stroke="#0f1b2d" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(6)">
      <path d="M0 -84 L62 54 L0 20 L-62 54 Z" fill="#4db8ff" stroke="#d8f0ff" stroke-width="5" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- sleepy Zs -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" fill="url(#gold)" stroke="#0f1b2d" stroke-width="2" paint-order="stroke">
    <text x="292" y="92" font-size="46">Z</text>
    <text x="326" y="58" font-size="34">z</text>
    <text x="350" y="34" font-size="24">z</text>
  </g>
  <!-- the name -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="200" y="318" font-size="50" fill="url(#gold)" stroke="#0f1b2d" stroke-width="3" paint-order="stroke" letter-spacing="2">FOREVER</text>
    <text x="200" y="366" font-size="50" fill="url(#gold)" stroke="#0f1b2d" stroke-width="3" paint-order="stroke" letter-spacing="10">LAZY</text>
  </g>
</svg>
