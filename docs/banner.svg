<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Forever Lazy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#2a1740"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#f0a92b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4db8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4db8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="190" cy="160" r="150" fill="url(#glow)"/>
  <!-- the three arrows -->
  <g transform="translate(190 160)">
    <g transform="rotate(-35) translate(-110 0)" opacity="0.9">
      <path d="M0 -34 L26 22 L0 8 L-26 22 Z" fill="#6bd16b"/>
    </g>
    <g transform="rotate(25) translate(95 -10)" opacity="0.9">
      <path d="M0 -30 L23 20 L0 7 L-23 20 Z" fill="#ffd94d"/>
    </g>
    <g transform="rotate(8)">
      <path d="M0 -62 L46 40 L0 14 L-46 40 Z" fill="#4db8ff" stroke="#d8f0ff" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="370" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="url(#gold)">Forever Lazy</text>
  <text x="372" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#cfd8e8">Never think about where to go next</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#0f1b2d" font-weight="600">
    <rect x="372" y="226" width="150" height="34" rx="17" fill="#6bd16b"/><text x="447" y="249" text-anchor="middle">Route planner</text>
    <rect x="534" y="226" width="120" height="34" rx="17" fill="#ffd94d"/><text x="594" y="249" text-anchor="middle">Guides</text>
    <rect x="666" y="226" width="150" height="34" rx="17" fill="#4db8ff"/><text x="741" y="249" text-anchor="middle">Party arrows</text>
    <rect x="828" y="226" width="150" height="34" rx="17" fill="#ff9ad5"/><text x="903" y="249" text-anchor="middle">Collections</text>
  </g>
</svg>
